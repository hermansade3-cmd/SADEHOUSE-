<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SADE HOUSE</title><meta name=theme-color content="#0f4d2e"><link rel=manifest href=manifest.webmanifest><link rel=icon href=icon-192.png><link rel=apple-touch-icon href=icon-192.png>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0f4d2e;--on:#fff;--bg:#fff;--tx:#14201a;--mu:#64746a;--ln:#e3e9e5;--cd:#f4f8f5;--gl:#dcefe3;--ac:#f2b705;--rd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--g:#5cc88a;--on:#08160e;--bg:#0f1713;--tx:#e8f0ea;--mu:#98a89d;--ln:#24332a;--cd:#16211b;--gl:#1f3a2b;--rd:#ff8a80}}
:root[data-theme=dark]{--g:#5cc88a;--on:#08160e;--bg:#0f1713;--tx:#e8f0ea;--mu:#98a89d;--ln:#24332a;--cd:#16211b;--gl:#1f3a2b;--rd:#ff8a80}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#st{height:4px;background:linear-gradient(90deg,#1eb53a 0 40%,#fcd116 40% 55%,#111 55% 70%,#00a3dd 70%)}
#hd{display:flex;align-items:center;gap:10px;padding:12px 14px 2px;max-width:640px;margin:auto}
#hd b{display:block;font-size:17px;font-weight:800;letter-spacing:.6px;color:var(--g);line-height:1.1}#hd small{color:var(--mu);font-size:12px}
#v{padding:8px 14px 150px;max-width:640px;margin:auto}
h2{margin:10px 0 12px;font-size:22px;font-weight:800}h3{margin:20px 0 8px;font-size:15px;font-weight:800}
.hero{background:linear-gradient(135deg,#0f4d2e,#1c7a4a);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 6px 18px #0f4d2e33}
.hero small{opacity:.85}.hero b{display:block;font-size:30px;font-weight:800;margin:2px 0 12px}
.pb{height:8px;background:#ffffff33;border-radius:4px;overflow:hidden;margin-bottom:8px}.pb i{display:block;height:100%;background:#f2b705;border-radius:4px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c,.li{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px}
.c small{display:block;color:var(--mu);font-size:13px}.c b{font-size:21px;font-weight:800}.c.ok b{color:var(--g)}.c.bad{border-color:var(--rd)}.c.bad b{color:var(--rd)}
.li{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;align-items:center}.li small{color:var(--mu);display:block}
.v{text-decoration:line-through;opacity:.5}
button,.b{font:inherit;font-weight:700;background:var(--g);color:var(--on);border:0;border-radius:12px;padding:11px 16px;text-decoration:none;display:inline-block}
button.s,.b.s{background:var(--cd);color:var(--tx);border:1px solid var(--ln)}button.d{background:var(--rd);color:#fff}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
input:focus,select:focus{outline:2px solid var(--g);border-color:transparent}
label{display:block;color:var(--mu);font-size:13px}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav a{flex:1;text-align:center;padding:8px 0 6px;color:var(--mu);font-size:12px;text-decoration:none}
#nav a b{display:flex;justify-content:center;align-items:center;width:54px;height:30px;border-radius:15px;margin:0 auto 2px}
#nav a.on{color:var(--g);font-weight:800}#nav a.on b{background:var(--gl)}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;font-size:30px;padding:0;background:#f2b705;color:#1b1500;box-shadow:0 6px 16px #0004}
#m{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}#m.on{display:flex}
#sh{background:var(--bg);width:100%;max-width:640px;margin:auto;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.er{color:var(--rd);min-height:18px;margin:0}
.em{text-align:center;color:var(--mu);padding:26px 8px;border:1px dashed var(--ln);border-radius:16px}.pos{color:var(--g);font-weight:700}.neg{color:var(--rd);font-weight:700}
#t{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--g);color:var(--on);padding:8px 16px;border-radius:20px;display:none;z-index:99}
:root{--sf:#fff}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--sf:#16211b}}:root[data-theme=dark]{--sf:#16211b}
body{background:linear-gradient(180deg,var(--gl) 0,var(--bg) 260px) no-repeat,var(--bg);font-variant-numeric:tabular-nums}
#v{padding-bottom:180px}
.hero{background:radial-gradient(circle at 92% 0,#f2b70540,transparent 46%),linear-gradient(135deg,#0b3d24,#1c7a4a);border-radius:24px;padding:20px}
.c,.li{background:var(--sf);border:0;border-radius:18px;box-shadow:0 1px 0 var(--ln),0 10px 22px -16px #0f4d2e88}
.c.bad{box-shadow:inset 0 0 0 1.5px var(--rd)}.li:active,.c:active{transform:scale(.985)}
.occ{grid-column:1/-1;display:flex;align-items:center;gap:16px}.occ b{font-size:26px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.qa button{background:var(--sf);color:var(--tx);border-radius:18px;padding:12px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 1px 0 var(--ln),0 10px 22px -16px #0f4d2e88}.qa svg{color:var(--g)}
.sm{padding:7px 12px;font-size:13px}
#nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-bottom:0;border:0;border-radius:26px;background:var(--sf);box-shadow:0 12px 32px -10px #0f4d2eaa,0 0 0 1px var(--ln)}
#fab{bottom:calc(92px + env(safe-area-inset-bottom,0px));border-radius:20px}
#sh{border-radius:26px 26px 0 0}

<script>
const $=s=>document.querySelector(s),sum=a=>a.reduce((x,y)=>x+y,0),id=()=>Math.random().toString(36).slice(2,9);
const fm=n=>'TSh '+Math.round(n).toLocaleString('en-US'),today=()=>new Date().toLocaleDateString('sv',{timeZone:'Africa/Dar_es_Salaam'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const def=()=>({p:[],u:[],t:[],y:[],k:[],x:[],nt:{on:0,days:3,dd:5,hide:1,last:''},kn:0,n:0,ll:'',lp:'',la:'',last:''});
function load(){try{const d=JSON.parse(localStorage.getItem(LG.db())||'null');return d&&Array.isArray(d.p)?{...def(),...d}:def()}catch(e){return def()}}
let D=def(),tab='home',q='';
let DB;const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open(LG.db(),1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kvAll=()=>new Promise((ok,no)=>{const o={},c=DB.transaction('kv').objectStore('kv').openCursor();c.onsuccess=e=>{const x=e.target.result;if(x){o[x.key]=x.value;x.continue()}else ok(o)};c.onerror=()=>no(c.error)});
function save(){if(!DB){try{localStorage.setItem(LG.db(),JSON.stringify(D))}catch(e){toast('Imeshindwa kuhifadhi data')}return}
try{const tx=DB.transaction('kv','readwrite'),s=tx.objectStore('kv');Object.keys(D).forEach(k=>s.put(D[k],k));tx.oncomplete=cloudQ;tx.onerror=()=>toast('Imeshindwa kuhifadhi data')}catch(e){toast('Imeshindwa kuhifadhi data')}}
async function init(){try{DB=await idb();const all=await kvAll();delete all.acc;
if(Array.isArray(all.p))D={...def(),...all};else{D=load();if(D.p.length||D.t.length||D.y.length){save();toast('Data imehamishiwa kwenye IndexedDB')}}
navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){DB=null;D=load();toast('IndexedDB haipatikani; inatumia hifadhi ya kawaida')}
R();chk();LG.boot();addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})}
function toast(s,ms){const t=$('#t');t.textContent=s;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms||2600)}
const M=h=>{$('#sh').innerHTML=h+'<p id=er class=er></p>';$('#m').classList.add('on')},X=()=>$('#m').classList.remove('on');
const tn=i=>D.t.find(t=>t.id==i),un=i=>D.u.find(u=>u.id==i),pn=i=>D.p.find(p=>p.id==i);
const uname=u=>u?(pn(u.p)?.n||'')+' · '+u.n:'—';
function mc(s,e){const a=s.slice(0,7).split('-'),b=(e||today()).slice(0,7).split('-');return Math.max(0,(b[0]-a[0])*12+(b[1]-a[1])+1)}
const paid=t=>sum(D.y.filter(y=>y.t==t.id&&!y.v).map(y=>y.a));
const bal=t=>mc(t.start,t.end)*t.rent-paid(t);
function ph(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='255'+d.slice(1);return /^255[67]\d{8}$/.test(d)?d:''}
function F(title,fs,ok,v={}){M(`<h3>${title}</h3>`+fs.map(([k,l,t,o])=>`<label>${l}`+(t=='sel'?`<select name=${k}>${o.map(([a,b])=>`<option value="${a}"${v[k]==a?' selected':''}>${esc(b)}</option>`).join('')}</select>`:t=='ta'?`<textarea name=${k} rows=3>${esc(v[k]??'')}</textarea>`:`<input name=${k} type=${t||'text'} value="${esc(v[k]??'')}" ${t=='number'?'inputmode=numeric min=0':''}>`)+'</label>').join('')+'<div class=bt><button class=s onclick=X()>Ghairi</button><button onclick=OK()>Hifadhi</button></div>');
window.OK=()=>{const o={};document.querySelectorAll('#sh [name]').forEach(e=>o[e.name]=e.value.trim());const r=ok(o);if(r)$('#er').textContent=r;else{X();save();R()}}}
const int=s=>/^\d+$/.test(s)?parseInt(s,10):NaN;
function add(){M(`<h3>Ongeza</h3><div class=bt style="flex-direction:column"><button onclick=aP()>Mali (nyumba/jengo)</button><button onclick=aU()>Chumba / kipango</button><button onclick=aT()>Mpangaji</button><button onclick=aY()>Malipo ya kodi</button><button onclick=aE()>Matumizi</button><button class=s onclick=X()>Funga</button></div>`)}
function aP(){F('Mali mpya',[['n','Jina la mali'],['l','Eneo / mtaa']],o=>{if(!o.n)return'Weka jina la mali.';D.p.push({id:id(),n:o.n,l:o.l})})}
function aU(){if(!D.p.length){X();return toast('Ongeza mali kwanza')}F('Chumba kipya',[['p','Mali','sel',D.p.map(p=>[p.id,p.n])],['n','Namba / jina la chumba'],['r','Kodi kwa mwezi (TSh)','number'],['d','Amana (TSh)','number']],o=>{const r=int(o.r),d=o.d?int(o.d):0;if(!o.n)return'Weka namba ya chumba.';if(isNaN(r)||r<=0)return'Kodi lazima iwe namba kamili zaidi ya 0.';if(isNaN(d))return'Amana si sahihi.';if(D.u.some(u=>u.p==o.p&&u.n.toLowerCase()==o.n.toLowerCase()))return'Chumba hiki tayari kipo.';D.u.push({id:id(),p:o.p,n:o.n,r,d})})}
const vac=()=>D.u.filter(u=>!D.t.some(t=>t.s=='a'&&t.u==u.id));
function aT(){const v=vac();if(!v.length){X();return toast('Hakuna chumba kilicho wazi. Ongeza chumba.')}F('Mpangaji mpya',[['n','Jina kamili'],['ph','Simu (mf. 0712345678)','tel'],['u','Chumba','sel',v.map(u=>[u.id,uname(u)+' — '+fm(u.r)])],['r','Kodi kwa mwezi (acha wazi kutumia ya chumba)','number'],['s','Tarehe ya kuanza','date']],o=>{if(!o.n)return'Weka jina.';if(!ph(o.ph))return'Namba ya simu si sahihi (mf. 0712345678).';if(!o.s)return'Chagua tarehe ya kuanza.';const u=un(o.u),r=o.r?int(o.r):u.r;if(isNaN(r)||r<=0)return'Kodi si sahihi.';if(D.t.some(t=>t.s=='a'&&t.u==o.u))return'Chumba kina mpangaji tayari.';D.t.push({id:id(),n:o.n,ph:o.ph,u:o.u,rent:r,start:o.s,s:'a'})},{s:today()})}
function aY(tid){const a=D.t.filter(t=>t.s=='a');if(!a.length){X();return toast('Hakuna mpangaji hai')}F('Malipo ya kodi',[['t','Mpangaji','sel',a.map(t=>[t.id,t.n+' — '+uname(un(t.u))])],['a','Kiasi (TSh)','number'],['d','Tarehe','date'],['m','Njia','sel',[['Taslimu','Taslimu'],['Mobile money','Mobile money'],['Benki','Benki'],['Nyingine','Nyingine']]],['f','Namba ya muamala (hiari)'],['pm','Kwa mwezi wa','month']],o=>{const am=int(o.a);if(isNaN(am)||am<=0)return'Kiasi lazima kiwe namba kamili zaidi ya 0.';if(!o.d)return'Chagua tarehe.';if(D.y.some(y=>!y.v&&y.t==o.t&&y.a==am&&y.d==o.d&&(y.f||'')==o.f))return'Malipo yanayofanana yamerekodiwa tayari.';const y={id:id(),t:o.t,a:am,d:o.d,m:o.m,f:o.f,pm:o.pm,no:'SH-'+o.d.slice(0,4)+'-'+String(++D.n).padStart(4,'0')};D.y.push(y);setTimeout(()=>RC(y.id),50)},{t:tid,d:today(),pm:today().slice(0,7)})}
function RC(i){const y=D.y.find(x=>x.id==i),t=tn(y.t),u=un(t.u),n=ph(t.ph),b=bal(t);
const msg=`Habari ${t.n}, tumepokea TSh ${y.a.toLocaleString('en-US')} tarehe ${y.d}. Risiti ${y.no}. ${b>0?'Salio la deni: '+fm(b):b<0?'Kodi ya mbele: '+fm(-b):'Huna deni.'} Asante. - SADE HOUSE`;
LM=msg;M(`<div id=rc><h3 style="margin-top:0;color:var(--g)">SADE HOUSE</h3>${D.ll?`<div>${esc(D.ll)}</div>`:''}<p><b>RISITI ${y.no}</b>${y.v?' — IMEBATILISHWA':''}</p><p>Mpangaji: <b>${esc(t.n)}</b><br>Chumba: ${esc(uname(u))}<br>Kiasi: <b>${fm(y.a)}</b><br>Tarehe: ${y.d}<br>Njia: ${esc(y.m)}${y.f?' ('+esc(y.f)+')':''}<br>Kwa mwezi: ${y.pm||'—'}<br>${b>0?'Deni lililobaki: '+fm(b):b<0?'Kodi ya mbele: '+fm(-b):'Hakuna deni'}</p></div><div class=bt><button onclick=print()>Chapisha / PDF</button><button class=s onclick=cpy(LM)>Nakili</button>${n?`<a class=b href="https://wa.me/${n}?text=${encodeURIComponent(msg)}" target=_blank rel=noopener>WhatsApp</a><a class="b s" href="sms:+${n}?body=${encodeURIComponent(msg)}">SMS</a>`:''}${y.v?'':`<button class=d onclick="bv('${y.id}')">Batilisha</button>`}<button class=s onclick=X()>Funga</button></div><small style="color:var(--mu)">WhatsApp/SMS hufunguliwa na ujumbe uliotayarishwa; wewe unahakiki kisha kutuma. Programu haiwezi kuthibitisha kuwa ujumbe umefika.</small>`)}
function bv(i){if(confirm('Kubatilisha malipo haya? Rekodi itabaki kwa ukaguzi, lakini haitahesabiwa.')){D.y.find(y=>y.id==i).v=1;save();X();R()}}
function TP(i){const t=tn(i),b=bal(t),ys=D.y.filter(y=>y.t==i).reverse();
M(`<h3 style="margin-top:0">${esc(t.n)}</h3><p>${esc(t.ph)} · ${esc(uname(un(t.u)))}<br>Kodi: ${fm(t.rent)}/mwezi · Tangu ${t.start}${t.end?' hadi '+t.end:''}<br>Imetozwa: ${fm(mc(t.start,t.end)*t.rent)} · Imelipwa: ${fm(paid(t))}<br>${b>0?`<span class=neg>Deni: ${fm(b)}</span>`:b<0?`<span class=pos>Kodi ya mbele: ${fm(-b)}</span>`:'<span class=pos>Hakuna deni</span>'}</p><h3>Taarifa ya akaunti</h3>`+(ys.length?ys.map(y=>`<div class="li ${y.v?'v':''}" onclick="RC('${y.id}')"><div>${y.d}<small>${y.no} · ${esc(y.m)}</small></div><b>${fm(y.a)}</b></div>`).join(''):'<div class=em>Hakuna malipo bado.</div>')+`<div class=bt><button class=s onclick="aK('','${i}')">Mkataba</button>${t.s=='a'?`<button onclick="aY('${i}')">Lipa</button><button class=d onclick="mo('${i}')">Amehama</button>`:''}<button class=s onclick=X()>Funga</button></div>`)}
function mo(i){if(confirm('Kumwondoa mpangaji? Historia ya malipo itabaki.')){const t=tn(i);t.s='o';t.end=today();save();X();R()}}
